# Mutation proofs replayed by the pinned ckdev-mutate runner (see README.md,
# "Mutation catalogue"). Each row deliberately breaks one production guard
# and names the Bun test(s) that must fail because of it.
#
# Command-row `{test}` values are passed to Bun as `-t` regexes over full test
# names (describe names and the test name joined by single spaces). Most ids are
# anchored (^...$) and escaped, with `\s` for each space, because ckdev-mutate
# refuses whitespace in an id. Rows with a JUnit breadth audit (`broad_command`)
# use the literal leaf name instead, so `broad_id = '{name}'` maps the same
# testcase in the report; without those fields a `--broad` run cannot tell the
# named failure from collateral failures in the same file. `Ran {count} test` verifies one named test
# executes on both clean and mutated trees. Fixtures import from `dist/`, so the
# prebuild steps install and build before the baseline and each mutant. Replay
# with the Bun version CI pins (1.3.14): `rpc-declared-oversize-413-half-closes`
# guards a workaround for Bun 1.3.14 reusing a connection refused with 413, which
# Bun 1.4.2 no longer does.
prebuild = [
  { name = "install", command = ["bun", "install", "--frozen-lockfile"], timeout_s = 600 },
  { name = "build", command = ["bun", "run", "build"], timeout_s = 600 },
]

# --- staged roster publication (0.12.0) ---
# The runner first proves a named test passes with its guard intact, then
# deliberately removes that guard and requires the same test to fail. The
# command prints the source diff in each run to show when the break is present.
# Each filter selects one named test; unrelated failures cannot count as catches.

[[control]]
id = 'store-stage-refuse'
broad_command = ['bun', 'test', 'test/store/staged-replacement.test.ts', '--reporter=junit', '--reporter-outfile=staged-replacement-broad.xml']
broad_report = 'staged-replacement-broad.xml'
broad_id = '{name}'
guards = 'refuse never rotates or writes an existing secret holder'
file = 'src/store/rows.ts'
old = "if (mode === 'refuse') {"
new = "if (mode === 'stage-duplicate' /* NON-VACUITY BREAK */) {"
test_file = 'test/store/staged-replacement.test.ts'
runner = 'command'
command = ['sh', '-c', 'git diff --stat; bun test test/store/staged-replacement.test.ts -t "$1"', 'sh', '{test}']
test_count_pattern = 'Ran {count} test'
expect_red = ['staged replacement refuse preserves holder and duplicate requires both staging fields']
expect_message = 'error: expect('

