# --- dump ---

[[control]]
id = 'dump-counter-is-process-wide'
guards = 'the dump sequence counter is shared by every dumper in the process, so two dumpers never pick the same name in one millisecond'
edits = [
  { file = 'src/dump/index.ts', old = "  function remember(key: string, text: string): void {", new = "  let dumperCounter = 0\n  function remember(key: string, text: string): void {" },
  { file = 'src/dump/index.ts', old = "const counter = ++processDumpCounter", new = "const counter = ++dumperCounter" },
]
test_file = 'test/dump/dump.test.ts'
runner = "command"
command = ["bun", "test", "test/dump/dump.test.ts", "-t", "{test}"]
test_count_pattern = "Ran {count} test"
expect_red = ['^request\sdumps\stwo\sdumpers\sin\sone\sprocess\snever\scollide\sin\sthe\ssame\smillisecond$']
expect_message = '/expect\(received\)\.toBeDefined\(\)\s+Received: undefined/'

[[control]]
