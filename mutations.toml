# --- tui-build ---

[[control]]
id = 'tui-build-emits-one-copy-per-shared-module'
guards = 'a shared module reached from several importers is emitted once, so its consumers share one module instance'
file = 'src/tui-build/build-tui.ts'
old = '''
    const previous = copied.get(source)
    if (previous) return previous'''
new = '''
    const previous = copied.get(source)
    if (previous && source === '') return previous'''
test_file = 'test/tui-build/linking.test.ts'
runner = "command"
command = ["bun", "test", "test/tui-build/linking.test.ts", "-t", "{test}"]
test_count_pattern = "Ran {count} test"
expect_red = ['^inlined\sfs\sand\ssidebar\sconsumers\sshare\sone\sLockContentionError\sidentity$']
expect_message = 'is claimed by both'

[[control]]
