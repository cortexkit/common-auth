# Mutation proofs replayed by the pinned ck-mutate runner (see README.md,
# "Mutation catalogue"). Each row deliberately breaks one production guard
# and names the Bun test(s) that must fail because of it.
#
# Every row is a `command` row: `{test}` is a Bun `-t` filter, which Bun reads
# as a regular expression over the full test name (describe names and the
# test name joined by single spaces). The ids are anchored (^...$) and escaped,
# with `\s` standing for each space because ck-mutate refuses whitespace in an
# id. `Ran {count} test` matches Bun's summary line ("Ran 1 test across 1
# file."), which proves the filter selected a test on both the clean and the
# mutated tree. Test fixtures import the built package through dist/, so the
# prebuild steps install and build before the baseline and again after every
# mutant edit. Replay with the Bun version .github/workflows/ci.yml pins
# (1.3.14): the row rpc-declared-oversize-413-half-closes guards a workaround for
# Bun 1.3.14 reusing a connection the server refused with 413, which Bun 1.4.2
# no longer does, so that row survives on 1.4.2.
prebuild = [
  { name = "install", command = ["bun", "install", "--frozen-lockfile"], timeout_s = 600 },
  { name = "build", command = ["bun", "run", "build"], timeout_s = 600 },
]

# --- fs locks ---

[[control]]
id = 'fs-lock-live-holder-excludes-second-acquirer'
guards = 'a live lock refuses a second acquirer: a holder whose lease has not expired is never treated as stale and evicted'
file = 'src/fs/refresh-file-lock.ts'
old = 'return Number(currentOwner?.expiresAt) > now()'
new = 'return false'
test_file = 'test/fs/with-lock.test.ts'
runner = "command"
command = ["bun", "test", "test/fs/with-lock.test.ts", "-t", "{test}"]
test_count_pattern = "Ran {count} test"
expect_red = ['^contention\swaits\sand\sreports\slock\sidentity$']
expect_message = '/Expected constructor: \[class LockContentionError[^\n]*\nReceived value: undefined/'

[[control]]
id = 'fs-lock-try-once-refuses-held-lock'
guards = 'the try-once acquire returns null while another owner holds the lock, instead of reporting an existing lock file as acquired'
file = 'src/fs/refresh-file-lock.ts'
old = "if (code === 'EEXIST' || code === 'EISDIR') return false"
new = "if (code === 'EEXIST' || code === 'EISDIR') return true"
test_file = 'test/fs/with-lock.test.ts'
runner = "command"
command = ["bun", "test", "test/fs/with-lock.test.ts", "-t", "{test}"]
test_count_pattern = "Ran {count} test"
expect_red = ['^the\sfs\ssubpath\sexports\sthe\stry-once\slock:\sa\sheld\slock\sreturns\snull\suntil\sreleased$']
expect_message = '/expect\(received\)\.toBeNull\(\)\s+Received: \{/'

[[control]]
id = 'fs-lock-release-is-owner-fenced'
guards = "release removes the lock only while it still carries this owner's id, never a successor's lock"
file = 'src/fs/refresh-file-lock.ts'
old = '''
            const owner = await readOwner()
            if (owner?.ownerId !== ownerId) return
            if (options.onStep) await options.onStep('release-owner-confirmed')'''
new = '''
            const owner = await readOwner()
            void owner
            if (options.onStep) await options.onStep('release-owner-confirmed')'''
test_file = 'test/fs/refresh-file-lock.test.ts'
runner = "command"
command = ["bun", "test", "test/fs/refresh-file-lock.test.ts", "-t", "{test}"]
test_count_pattern = "Ran {count} test"
expect_red = ['^acquireRefreshFileLock\sassertOwned\sobserves\stakeover\swith\sownership\sdetails\swithout\srenewal$']
expect_message = '/ENOENT: no such file or directory, open .*assert-observed\.json\.assert\.lock/'

[[control]]
id = 'fs-lock-relinquish-after-marker-loss-is-owner-fenced'
guards = 'after losing its eviction marker post-write, a renewal relinquishes only a lock record that still carries its own owner id'
