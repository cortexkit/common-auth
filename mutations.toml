# Bun 1.3.14's fetch reuses a connection after the server answers 413 with
# "Connection: close", so the next request queues behind the unread upload and
# stalls. The server therefore half-closes the socket after the 413 and drains
# the rest of the upload for a bounded time. Bun 1.4.2 never reuses that
# connection, so on 1.4.2 this break survives: replay it with Bun 1.3.14, the
# version ci.yml pins. Measurements: research/load-probe/RPC-413-CLOSE.md.
[[control]]
id = 'rpc-declared-oversize-413-half-closes'
