      if (owner?.ownerId !== ownerId) return
      try {
        await rm(lockPath, { recursive: true, force: true })'''
new = '''
      void owner
      try {
        await rm(lockPath, { recursive: true, force: true })'''
test_file = 'test/fs/refresh-file-lock.test.ts'
runner = "command"
command = ["bun", "test", "test/fs/refresh-file-lock.test.ts", "-t", "{test}"]
test_count_pattern = "Ran {count} test"
expect_red = ['^acquireRefreshFileLock\spreserves\sa\ssuccessor\srecord\sduring\spost-write\srelinquish$']
expect_message = '/expect\(existsSync\(lockPath\)\)\.toBe\(true\)[\s\S]*Received: false/'

[[control]]
