# --- shared quota wording and menu grouping (0.13.0) ---
# Every plugin's dialog, sidebar and auth menu shows quota through one
# formatter (`src/quota/format.ts`), and every menu renderer draws group
# headers and rows without actions as text a user cannot select. The three
# `quota-format-*` rows below break the formatter (dropping the omission of
# unreported windows, the stale-age marker, and naming windows by length);
# the three `commands-*` rows break grouping (the seam carrying an item's
# group, the built-in Accounts header, and Pi keeping action-less rows out of
# its options).

[[control]]
id = 'quota-format-omits-unreported-windows'
guards = 'a window the provider did not report is left out of the quota text instead of appearing as a figure'
file = 'src/quota/format.ts'
old = "limit.kind === 'reading' && limit.remainingPercent !== undefined,"
new = "true /* NON-VACUITY BREAK */,"
test_file = 'test/quota/format.test.ts'
runner = 'command'
command = ['bun', 'test', 'test/quota/format.test.ts', '-t', '{test}']
test_count_pattern = 'Ran {count} test'
expect_red = ['^shared\squota\swording\sa\swindow\sthe\sprovider\sdid\snot\sreport\sis\sleft\sout,\snever\swritten\sas\snot\sreported$']
expect_message = 'error: expect('

[[control]]
id = 'quota-format-marks-stale-readings'
guards = 'a quota reading older than fifteen minutes says how old it is, so a stale figure is never shown as current'
file = 'src/quota/format.ts'
old = 'if (age > (options.staleAfterMs ?? QUOTA_STALE_AFTER_MS))'
new = 'if (false /* NON-VACUITY BREAK */)'
test_file = 'test/quota/format.test.ts'
runner = 'command'
command = ['bun', 'test', 'test/quota/format.test.ts', '-t', '{test}']
test_count_pattern = 'Ran {count} test'
