name: Windows private files
on:
  workflow_dispatch:
  push:
    branches: ['main', 'windows-private-files-*']
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'tsconfig*.json'
      - '.github/workflows/windows-private-files.yml'
      - 'package.json'
      - 'bun.lock'
  pull_request:
    paths:
      - 'src/fs/**'
      - 'src/rpc/**'
      - 'src/logger/**'
      - 'src/sidebar-file/**'
      - 'src/dump/**'
      - 'src/pi-slot/**'
      - 'src/claustrum/**'
      - 'src/setup/**'
      - 'test/setup/**'
      - 'test/windows/**'
      - 'test/claustrum/**'
      - '.github/workflows/windows-private-files.yml'
      - 'package.json'
      - 'bun.lock'
permissions:
  contents: read
jobs:
  publish-timing:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/windows-private-files-')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '26.3.0'
          architecture: ${{ matrix.os == 'windows-11-arm' && 'arm64' || 'x64' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Build the ownership timing probe
        shell: pwsh
        run: |
          node --version
          bun --version
          bun install --frozen-lockfile
          if ($LASTEXITCODE) { throw 'Install failed' }
          bun run build
          if ($LASTEXITCODE) { throw 'Build failed' }
      - name: Time real lease ownership checks and native steps
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publish-timing-evidence | Out-Null
          node test/windows/publish-timing.mjs 2>&1 | Tee-Object publish-timing-evidence/node.jsonl
          if ($LASTEXITCODE) { throw 'Node publication timing failed' }
          bun test/windows/publish-timing.mjs 2>&1 | Tee-Object publish-timing-evidence/bun.jsonl
          if ($LASTEXITCODE) { throw 'Bun publication timing failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: publish-timing-${{ matrix.os }}
          path: publish-timing-evidence/
          if-no-files-found: error
  vault-enrollment:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022, windows-11-arm]
        runtime: [node, bun-1.4.2, bun-1.3.14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          architecture: ${{ matrix.os == 'windows-11-arm' && 'arm64' || 'x64' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.runtime == 'bun-1.3.14' && '1.3.14' || '1.4.2' }}
      - name: Install locked client and build common-auth
        timeout-minutes: 8
        shell: pwsh
        run: |
          node --version
          bun --version
          bun install --frozen-lockfile
          if ($LASTEXITCODE) { throw 'Install failed' }
          bun run build
          if ($LASTEXITCODE) { throw 'Build failed' }
          bun run types
          if ($LASTEXITCODE) { throw 'Types failed' }
      - name: Real profile vault enrollment, serving, rewrite and disconnect
        timeout-minutes: 6
        shell: pwsh
        env:
          VAULT_RUNTIME: ${{ matrix.runtime }}
        run: |
          if ($env:VAULT_RUNTIME -eq 'node') { ./test/windows/run-vault.ps1 -Runtime node }
          else { ./test/windows/run-vault.ps1 -Runtime bun -ExpectedVersion ($env:VAULT_RUNTIME.Substring(4)) }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 2
        if: always()
        with:
          name: windows-vault-${{ matrix.os }}-${{ matrix.runtime }}
          path: windows-vault-evidence/
          if-no-files-found: error
  # The discovery hub commits member rosters, and on Windows every roster
  # write and lease goes through @cortexkit/private-files.
  claustrum-hub:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022, windows-11-arm]
        bun: ['1.4.2', '1.3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          architecture: ${{ matrix.os == 'windows-11-arm' && 'arm64' || 'x64' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.bun }}
      - name: Discovery hub tests on Windows private files
        timeout-minutes: 10
        shell: pwsh
        run: |
          bun --version
          bun install --frozen-lockfile
          if ($LASTEXITCODE) { throw 'Install failed' }
          bun test test/claustrum/hub.test.ts
          if ($LASTEXITCODE) { throw 'Discovery hub tests failed' }
  setup-npm-host:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022, windows-11-arm, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Build and install a real npm OpenCode launcher
        shell: pwsh
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE) { throw 'Install failed' }
          bun run build
          if ($LASTEXITCODE) { throw 'Build failed' }
          npm install --global opencode-ai
          if ($LASTEXITCODE) { throw 'OpenCode install failed' }
      - name: Time 10 real Windows process listings
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          node test/setup/windows-process-timing.mjs
          if ($LASTEXITCODE) { throw 'Windows process timing observed listing failures' }
      - name: Node real Windows process listing and Node/Bun Pi process fencing
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node test/setup/windows-processes.mjs
          if ($LASTEXITCODE) { throw 'Real Windows process inspection failed' }
      - name: Node setup dry run and real idempotent registration in a fresh profile
        shell: pwsh
        run: |
          node --version
          node test/setup/npm-host.mjs
          if ($LASTEXITCODE) { throw 'Shared setup npm-host checks failed' }
  writers:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          architecture: ${{ matrix.os == 'windows-11-arm' && 'arm64' || 'x64' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Install published backend and build common-auth
        timeout-minutes: 8
        shell: pwsh
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE) { throw 'Install failed' }
          bun run build
          if ($LASTEXITCODE) { throw 'Build failed' }
          bun run typecheck
          if ($LASTEXITCODE) { throw 'Typecheck failed' }
      - name: Provision and warm standard probe user
        id: probe_account
        timeout-minutes: 4
        shell: pwsh
        run: |
          $exe = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./test/windows/provision-user.ps1
          if ($LASTEXITCODE) { throw 'Standard-user profile provisioning failed' }
      - name: Node native loader smoke
        id: node_load
        timeout-minutes: 2
        if: always()
        shell: pwsh
        run: |
          node --input-type=module -e "import { verifyOwnerOnly } from '@cortexkit/private-files'; const r = await verifyOwnerOnly(process.cwd()); if (!r.ok && r.refusal.reason === 'unsupported-filesystem') throw new Error(r.refusal.message); console.log(process.version, process.arch, 'native loader reached ACL verification')"
          if ($LASTEXITCODE) { throw 'Native Node loader failed' }
      - name: Node real ACLs, writers, denial positive control and sharing
        id: node_acl
        timeout-minutes: 6
        if: always()
        shell: pwsh
        env:
          COMMON_AUTH_PROBE_USER: ${{ steps.probe_account.outputs.user }}
          COMMON_AUTH_PROBE_PASSWORD: ${{ steps.probe_account.outputs.password }}
          COMMON_AUTH_PROBE_SID: ${{ steps.probe_account.outputs.sid }}
        run: ./test/windows/run.ps1 -Runtime node
      - name: Bun 1.4.2 native loader smoke
        id: bun142_load
        timeout-minutes: 2
        if: always()
        shell: pwsh
        run: |
          bun -e "import { verifyOwnerOnly } from '@cortexkit/private-files'; const r = await verifyOwnerOnly(process.cwd()); if (!r.ok && r.refusal.reason === 'unsupported-filesystem') throw new Error(r.refusal.message); console.log(Bun.version, process.arch, 'native loader reached ACL verification')"
          if ($LASTEXITCODE) { throw 'Native Bun loader failed' }
      - name: Bun 1.4.2 real writers
        id: bun142_acl
        timeout-minutes: 6
        if: always()
        shell: pwsh
        env:
          COMMON_AUTH_PROBE_USER: ${{ steps.probe_account.outputs.user }}
          COMMON_AUTH_PROBE_PASSWORD: ${{ steps.probe_account.outputs.password }}
          COMMON_AUTH_PROBE_SID: ${{ steps.probe_account.outputs.sid }}
        run: ./test/windows/run.ps1 -Runtime bun -ExpectedVersion '1.4.2'
      - name: Bun 1.4.2 mutation proofs
        id: bun142_mutations
        timeout-minutes: 6
        if: always()
        shell: pwsh
        env:
          COMMON_AUTH_PROBE_USER: ${{ steps.probe_account.outputs.user }}
          COMMON_AUTH_PROBE_PASSWORD: ${{ steps.probe_account.outputs.password }}
          COMMON_AUTH_PROBE_SID: ${{ steps.probe_account.outputs.sid }}
        run: ./test/windows/mutations.ps1 -ExpectedVersion '1.4.2'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        id: bun1314_setup
        timeout-minutes: 2
        if: always()
        with:
          bun-version: '1.3.14'
      - name: Bun 1.3.14 native loader smoke
        id: bun1314_load
        timeout-minutes: 2
        if: always()
        shell: pwsh
        run: |
          bun -e "import { verifyOwnerOnly } from '@cortexkit/private-files'; const r = await verifyOwnerOnly(process.cwd()); if (!r.ok && r.refusal.reason === 'unsupported-filesystem') throw new Error(r.refusal.message); console.log(Bun.version, process.arch, 'native loader reached ACL verification')"
          if ($LASTEXITCODE) { throw 'Native Bun loader failed' }
      - name: Bun 1.3.14 real writers
        id: bun1314_acl
        timeout-minutes: 6
        if: always()
        shell: pwsh
        env:
          COMMON_AUTH_PROBE_USER: ${{ steps.probe_account.outputs.user }}
          COMMON_AUTH_PROBE_PASSWORD: ${{ steps.probe_account.outputs.password }}
          COMMON_AUTH_PROBE_SID: ${{ steps.probe_account.outputs.sid }}
        run: ./test/windows/run.ps1 -Runtime bun -ExpectedVersion '1.3.14'
      - name: Bun 1.3.14 mutation proofs
        id: bun1314_mutations
        timeout-minutes: 6
        if: always()
        shell: pwsh
        env:
          COMMON_AUTH_PROBE_USER: ${{ steps.probe_account.outputs.user }}
          COMMON_AUTH_PROBE_PASSWORD: ${{ steps.probe_account.outputs.password }}
          COMMON_AUTH_PROBE_SID: ${{ steps.probe_account.outputs.sid }}
        run: ./test/windows/mutations.ps1 -ExpectedVersion '1.3.14'
      - name: Remove standard probe user
        id: probe_cleanup
        timeout-minutes: 2
        if: always()
        shell: pwsh
        env:
          PROBE_USER: ${{ steps.probe_account.outputs.user }}
          PROBE_SID: ${{ steps.probe_account.outputs.sid }}
        run: |
          $exe = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./test/windows/cleanup-user.ps1 -Name $env:PROBE_USER -ExpectedSid $env:PROBE_SID
          if ($LASTEXITCODE) { throw 'Probe account cleanup failed' }
      - name: Require every runtime check to pass
        timeout-minutes: 2
        if: always()
        shell: pwsh
        env:
          PROBE_SETUP: ${{ steps.probe_account.outcome }}
          PROBE_CLEANUP: ${{ steps.probe_cleanup.outcome }}
          NODE_LOAD: ${{ steps.node_load.outcome }}
          NODE_ACL: ${{ steps.node_acl.outcome }}
          BUN142_LOAD: ${{ steps.bun142_load.outcome }}
          BUN142_ACL: ${{ steps.bun142_acl.outcome }}
          BUN142_MUTATIONS: ${{ steps.bun142_mutations.outcome }}
          BUN1314_SETUP: ${{ steps.bun1314_setup.outcome }}
          BUN1314_LOAD: ${{ steps.bun1314_load.outcome }}
          BUN1314_ACL: ${{ steps.bun1314_acl.outcome }}
          BUN1314_MUTATIONS: ${{ steps.bun1314_mutations.outcome }}
        run: |
          $checks = @('PROBE_SETUP','PROBE_CLEANUP','NODE_LOAD','NODE_ACL','BUN142_LOAD','BUN142_ACL','BUN142_MUTATIONS','BUN1314_SETUP','BUN1314_LOAD','BUN1314_ACL','BUN1314_MUTATIONS')
          $failed = @($checks | Where-Object { [Environment]::GetEnvironmentVariable($_) -ne 'success' })
          foreach ($check in $checks) { Write-Host "$check $([Environment]::GetEnvironmentVariable($check))" }
          if ($failed.Count) { throw "Runtime qualification failed: $($failed -join ', ')" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 2
        if: always()
        with:
          name: windows-private-files-${{ matrix.os }}
          path: windows-private-files-evidence/
          if-no-files-found: error
