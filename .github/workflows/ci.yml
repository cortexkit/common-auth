name: CI
on:
  push:
  pull_request:
  # The release workflow calls this on the tagged commit and publishes only if
  # every job here passes.
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun: ["1.3.14", "1.4.2", "1.4.4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.bun }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Typecheck
        run: bun run typecheck
      - name: Claustrum client floor (0.6.2) compatibility
        run: bun run check:claustrum-floor
      - name: OpenTUI 0.5.11 compatibility
        run: bun run check:opentui-0511
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun test --reporter=junit --reporter-outfile=test-results.xml
      - name: Check source evidence
        run: bun scripts/check-sources.mjs docs/sources.md test-results.xml
  # The discovery hub commits member rosters through common-auth's file
  # writers, so its tests run on macOS as well as in the Linux job above.
  # Windows runs them in windows-private-files.yml.
  claustrum-hub-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        bun: ["1.3.14", "1.4.2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.bun }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Discovery hub and consumer tests
        run: |
          bun --version
          bun test test/claustrum/hub.test.ts test/claustrum/consumer.test.ts
  # Runs the real OpenCode 2 CLI (installed from npm at test time, pinned in
  # the test) against a loopback mock provider. It fails when a host release
  # stops firing, or moves, one of the hooks the /opencode2 subpath relies on.
  opencode2-placement:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: OpenCode 2 placement contract
        env:
          COMMON_AUTH_OPENCODE2_E2E: "1"
        run: bun test --reporter=junit --reporter-outfile=opencode2-placement-results.xml test/opencode2/e2e/placement.e2e.test.ts
      - name: Check source evidence
        run: bun scripts/check-sources.mjs test/opencode2/e2e/sources.md opencode2-placement-results.xml
